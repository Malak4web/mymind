name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-ci:
    name: Build & Test Frontend (Vue + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: timeout 20s npx vitest run --passWithNoTests || true
        timeout-minutes: 1

      - name: Build Frontend
        run: npm run build
        timeout-minutes: 1

  backend-ci:
    name: Build & Test Backend (Laravel API)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, pdo_sqlite, ctype, xml, json, curl, tokenizer
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd api
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment & Run Tests
        run: |
          cd api
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    timeout-minutes: 4
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, curl, xml, zip

      - name: Install PHP Dependencies
        run: |
          cd api
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 173.212.237.82
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2212
          source: "."
          target: "/var/www/mind"
          rm: false
          strip_components: 0
          tar_tmp_path: "/tmp"

      - name: Execute Post-Deployment Scripts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.212.237.82
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2212
          script: |
            cd /var/www/mind

            # Install backend dependencies on remote target if needed
            if [ -d "api" ]; then
              cd api
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
              
              # Run database migrations
              php artisan migrate --force

              # Recreate storage symlink
              php artisan storage:link --force || true

              # Clear & cache application config, routes, views, and events
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan event:cache || true

              # Set directory & file permissions safely
              find . -type f -exec chmod 644 {} \;
              find . -type d -exec chmod 755 {} \;
              chmod +x artisan
              
              # Ensure SQLite database file and folder have write permissions for web server (www-data)
              mkdir -p database
              touch database/database.sqlite
              chmod -R 777 database
              chmod 666 database/database.sqlite 2>/dev/null || true
              chmod -R 775 storage bootstrap/cache database
              chown -R www-data:www-data storage bootstrap/cache database 2>/dev/null || true
            fi
