name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-ci:
    name: Build & Test Frontend (Vue + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      # Colour classes on shades outside Tailwind's scale compile to nothing,
      # so the element silently inherits instead. 507 of these had accumulated
      # unnoticed, including the dark-mode page background. Fail the build.
      - name: Check for dead Tailwind colour classes
        run: npm run lint:classes

      - name: Run Frontend Tests
        run: npx vitest run --passWithNoTests
        timeout-minutes: 3

      - name: Build Frontend
        run: npm run build
        timeout-minutes: 2

  backend-ci:
    name: Build & Test Backend (Laravel API)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, pdo_sqlite, ctype, xml, json, curl, tokenizer
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd api
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment & Run Tests
        run: |
          cd api
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    timeout-minutes: 6
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    env:
      # Password auth restored at the owner's request so deploys keep working
      # with the existing SSH_PASSWORD secret. To move back to key auth, set
      # these three from secrets and swap `password:` for
      # `key: ${{ secrets.SSH_PRIVATE_KEY }}` in the two steps below.
      DEPLOY_HOST: 173.212.237.82
      DEPLOY_USER: root
      DEPLOY_PORT: 2212
      DEPLOY_PATH: /var/www/mind

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, curl, xml, zip

      - name: Install PHP Dependencies
        run: |
          cd api
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Build Frontend
        run: |
          npm install
          npm run build

      # Everything below is uploaded verbatim. Anything not needed at runtime
      # is removed first so it never reaches a web-accessible directory --
      # .git in particular can expose the full source history. See SEC-07.
      - name: Strip non-deployable files
        run: |
          rm -rf .git .github .agents node_modules src .vscode
          rm -f  ./*.log ./*.flag ./*.txt run_*.js run_*.cjs verify_suite.cjs
          rm -rf api/tests api/.git
          echo "--- payload ---"
          du -sh . && ls -A

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          source: "."
          target: ${{ env.DEPLOY_PATH }}
          rm: false
          strip_components: 0
          tar_tmp_path: "/tmp"

      - name: Execute Post-Deployment Scripts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}

            if [ ! -d "api" ]; then
              echo "api/ missing - aborting"; exit 1
            fi

            cd api
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Production settings are enforced here, not trusted from the
            # server's existing .env. Debug output leaks APP_KEY and the
            # Pusher secret in stack traces. See SEC-09.
            if [ -f .env ]; then
              # Strip Windows CRLF so sed patterns match correctly.
              sed -i 's/\r$//' .env

              sed -i 's|^APP_ENV=.*|APP_ENV=production|'  .env
              sed -i 's|^APP_DEBUG=.*|APP_DEBUG=false|'   .env
              sed -i 's|^LOG_LEVEL=.*|LOG_LEVEL=error|'   .env
              grep -q '^APP_ENV='   .env || echo 'APP_ENV=production' >> .env
              grep -q '^APP_DEBUG=' .env || echo 'APP_DEBUG=false'    >> .env
            else
              echo ".env missing on the server - aborting"; exit 1
            fi

            php artisan migrate --force
            php artisan storage:link --force || true

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache || true

            # Baseline permissions: readable, not writable, never world-writable.
            # `+` batches the paths into few chmod calls. With `\;` this forks
            # once per file and takes minutes on a vendor tree, blowing the
            # job timeout.
            find . -type f -not -path './storage/*' -exec chmod 644 {} +
            find . -type d -not -path './storage/*' -exec chmod 755 {} +
            chmod +x artisan

            # Secrets stay owner-only.
            chmod 600 .env

            # Only the runtime-writable trees get group write.
            mkdir -p database storage/app/public
            chmod -R 775 storage bootstrap/cache database
            [ -f database/database.sqlite ] && chmod 660 database/database.sqlite || true

            # `set -u` aborts on an unbound USER and `|| true` cannot catch an
            # expansion error, which would fail the deploy after upload+migrate.
            chown -R "${USER:-root}":www-data storage bootstrap/cache database 2>/dev/null || true

            # Fail loudly if debug somehow survived.
            # Clear cached config first so tinker reads the .env directly.
            php artisan config:clear
            if php artisan tinker --execute="exit(config('app.debug') ? 1 : 0);"; then
              echo "APP_DEBUG is off."
            else
              echo "APP_DEBUG is still enabled - failing the deploy."; exit 1
            fi
            # Re-cache config for production.
            php artisan config:cache
